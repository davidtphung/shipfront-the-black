name: GitHub Pages

on:
  push:
    branches: [main, claw]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Restore crate-os stills if missing
        run: |
          mkdir -p public/media
          base="https://raw.githubusercontent.com/davidtphung/shipfront-crate-os/main/public/media"
          for f in shelves.jpg parcels.jpg downtown-la.jpg route-nodes.jpg; do
            if [ ! -s "public/media/$f" ]; then
              curl -fsSL "$base/$f" -o "public/media/$f"
            fi
          done
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /shipfront-the-black
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
      - name: Point GitHub Pages at gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -F source[branch]=gh-pages \
            -F source[path]=/ \
            || gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f build_type=legacy \
            -F source[branch]=gh-pages \
            -F source[path]=/ \
            || true
